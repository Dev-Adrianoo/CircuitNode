openapi: 3.0.0
info:
  title: CNode API
  version: 1.0.0
  description: API for compiling and verifying Arduino code schemas.
servers:
  - url: http://localhost:3000/api
    description: Development server

paths:
  /compiler/message:
    get:
      summary: Test message endpoint
      description: Returns a simple test message.
      tags:
        - Compiler
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
                example: 'here stays the teste'

  /compiler/codehub:
    post:
      summary: Compile Arduino Code
      description: Receives circuit components and a board type, generates Arduino code, and compiles it.
      tags:
        - Compiler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CircuitMappingData'
      responses:
        '200':
          description: Compilation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompilerResult'
        '500':
          description: Server error during compilation
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Server error when trying to load"

  /compiler/upload:
    post:
      summary: Upload Arduino Code
      description: Receives verified Arduino code, board type, and port, then uploads it to the board.
      tags: 
        - Compiler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadData' 
      responses:
        '200':
          description: Upload successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      stdout:
                        type: string
                      stderr:
                        type: string
        '500':
          description: Server error during upload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Server error during upload"

components:
  schemas:
    NodeComponent:
      type: object
      required:
        - id
        - type
        - label
      properties:
        id:
          type: string
          example: "node_1"
        type:
          type: string
          example: "led"
        label:
          type: string
          example: "My LED"
        properties:
          type: object
          description: Component-specific properties (e.g., pin, delay).
          example:
            pin: 13
            delay: 1000

    CircuitMappingData:
      type: object
      required:
        - components
        - board
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/NodeComponent'
        board:
          type: string
          example: "uno"

    CompilerResult:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            stdout:
              type: string
            stderr:
              type: string
        generatedCode:
          type: string

    UploadData: 
      type: object
      required:
        - code
        - board
        - port
      properties:
        code:
          type: string
          description: The full arduino C++ code to be uploaded.
          example: "void setup() { pinMode(13, OUTPUT); void loop() { digitalWrite(13, HIGH) } }"
        board:
          type: string
          description: The full Qualified Board name (FQBN).
          example: "arduino:avr:uno"
        port:
          type: string
          description: The comunication port the board is connected to.
          example: "COM3"